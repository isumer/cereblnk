# Skill Selection Map (CB-097)
#
# The single source for WHICH skill a task needs, WHO loads it, and WHEN.
# Consumed by scripts/select-agents (floor computation) and validated by
# scripts/check-agent-skills (reachability). Agent frontmatter carries
# only invariant craft; everything stack-shaped resolves here, per task.
#
# Schema, one block per skill:
#   skill:      directory name under skills/<group>/<skill>/
#   roles:      specialists that receive this skill when a signal fires
#   paths:      regex over changed/declared file paths (task signal)
#   stack:      token that must appear in the stack profile for this
#               skill to be selectable at all (omitted = always)
#   topics:     literal phrases matched against the request text
#   discovery:  evidence seen INSIDE the agent window -> next skill
#               (the cascade; the agent loads it mid-run and records it)
#
# Floor = (path OR topic match) AND (stack token present, when declared).
# A skill reachable by no rule is a check-agent-skills failure.
#
# CB-143 adds the second, bounded direction. The line above describes a
# token that can only SUBTRACT, which is why a Spring Boot project once
# routed "add a REST endpoint" to the contract designer with no stack
# skills at all. So, additionally:
#
#   Completion = role ALREADY in the floor
#                AND this rule lists that role
#                AND this rule declares a stack token the profile carries.
#
# Completion attaches a skill; it never selects a role, and it does not
# run for the inferred fallback. Which roles are in the floor is still
# decided by path and topic rules only.

version: 1
rules:
  - skill: java
    roles: [backend-agent, architect-agent, debugger-agent, refactoring-agent]
    paths: ['\.java$']
    stack: java
    topics: [java, jvm, jdk, maven, gradle]
    discovery: ['spring-boot-starter -> spring-boot', '@Entity -> hibernate-jpa', 'JpaRepository -> hibernate-jpa', 'org.junit -> junit-testing']

  - skill: kotlin
    roles: [backend-agent]
    paths: ['\.kts?$']
    stack: kotlin
    topics: [kotlin]
    discovery: ['org.springframework -> spring-boot', '@Entity -> hibernate-jpa']

  - skill: csharp
    roles: [backend-agent]
    paths: ['\.cs$']
    stack: csharp
    topics: [csharp, c#, dotnet, .net]
    discovery: ['[Test] -> unit-testing']

  - skill: cpp
    roles: [backend-agent]
    paths: ['\.(cpp|cc|cxx|hpp)$']
    stack: cpp
    topics: [cpp, c++]

  - skill: dart
    roles: [frontend-agent]
    paths: ['\.dart$']
    stack: dart
    topics: [dart, flutter]
    discovery: ['flutter_test -> unit-testing']

  - skill: go
    roles: [backend-agent]
    paths: ['\.go$']
    stack: go
    topics: [go, golang]
    discovery: ['database/sql -> sql', 'testing.T -> unit-testing']

  - skill: groovy
    roles: [backend-agent, infra-agent]
    paths: ['(\.groovy$|\.gradle$|Jenkinsfile)']
    stack: groovy
    topics: [groovy, jenkinsfile, gradle dsl]
    discovery: ['pipeline { -> jenkins-pipelines']

  - skill: php
    roles: [backend-agent]
    paths: ['\.php$']
    stack: php
    topics: [php, laravel, symfony]
    discovery: ['PHPUnit -> unit-testing']

  - skill: python
    roles: [backend-agent]
    paths: ['\.py$']
    stack: python
    topics: [python, pip, django, flask]
    discovery: ['import pytest -> unit-testing', 'psycopg -> postgresql', 'import boto3 -> cloud-architecture']

  - skill: ruby
    roles: [backend-agent]
    paths: ['\.rb$']
    stack: ruby
    topics: [ruby, rails]
    discovery: ['RSpec -> unit-testing', 'ActiveRecord -> data-modeling']

  - skill: rust
    roles: [backend-agent]
    paths: ['\.rs$']
    stack: rust
    topics: [rust, cargo]
    discovery: ['#[test] -> unit-testing']

  - skill: swift
    roles: [frontend-agent]
