    topics: [javascript, js]
    discovery: ['require('express') -> nodejs', 'from 'vue' -> vue', 'next/router -> nextjs']

  - skill: typescript
    roles: [backend-agent, frontend-agent]
    paths: ['\.tsx?$']
    stack: typescript
    topics: [typescript, ts]
    discovery: ['@angular/core -> angular', 'from 'react' -> react', 'from "react" -> react']

  - skill: sql
    roles: [database-agent]
    paths: ['\.sql$']
    topics: [sql, query, join, index]
    discovery: ['EXPLAIN -> query-optimization', 'CREATE INDEX -> query-optimization', '<changeSet -> liquibase-migrations']

  - skill: shell
    roles: [infra-agent, backend-agent]
    paths: ['\.(sh|bash)$']
    topics: [shell, bash, shell script]
    discovery: ['kubectl -> kubernetes', 'terraform apply -> terraform', 'docker build -> docker']

  - skill: yaml
    roles: [infra-agent, backend-agent]
    paths: ['\.ya?ml$']
    topics: [yaml, manifest, values file]
    discovery: ['apiVersion: -> kubernetes', 'runs-on: -> github-actions', 'services: -> docker']

  - skill: css
    roles: [frontend-agent]
    paths: ['\.css$']
    topics: [css, stylesheet, cascade]

  - skill: scss
    roles: [frontend-agent]
    paths: ['\.(scss|sass)$']
