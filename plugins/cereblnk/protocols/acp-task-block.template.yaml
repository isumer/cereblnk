# ACP Task Block — Runtime → Agent
# Every agent receives exactly one Task Block and nothing else.
#
# Field rules:
# - role:                must end in "Agent"
# - risk:                low | medium | high; never silently downgraded
#                        (violation checker: SynthesizerAgent, gate-policy.md §4)
# - verification_level:  1 | 2 | 3, must match risk per policies/gate-policy.md
# - budget_tokens:       from policies/budget-policy.md; agent must report usage
# - context_refs:        CTX-* bundles from the Context OS — never raw repo paths
# - acceptance:          must be testable; a task with an untestable acceptance
#                        criterion is rejected by the PlannerAgent. A
#                        criterion must admit a declared, evidence-linked
#                        Known/Derived chain plus a load-bearing Estimated
#                        or Assumed claim, so long as its unknown is
#                        recorded. An undeclared assumption still fails.
# - acceptance_cmd:      OPTIONAL but strongly preferred wherever the criterion
#                        is commandable (test invocation, grep, build step).
#                        A weak executor cannot judge a sentence; it CAN run a
#                        command and read the exit code — lift the plan's
#                        verify: line here whenever it is executable.
#
# ---- Fully worked example (validates against) ----
acp_version: "1.0"
kind: task
task_id: T-014
run_id: R-2026-07-16-001
role: SecurityAgent
objective: >
  Determine whether the JWT validation change in AuthFilter introduces
  an authentication bypass.
constraints:
  - Do not evaluate performance implications (out of this agent's expertise)
  - Production system, zero-downtime requirement
risk: high
budget_tokens: 8000
verification_level: 3
context_refs:
  - ref: CTX-114   # compressed evidence bundle: AuthFilter diff
  - ref: CTX-115   # compressed evidence bundle: SecurityConfig
skills_required: [spring-security]   # this role's line from select-agents,
                                     # copied verbatim. Load these first.
discovery_watch:                     # the same role's discovery_watch lines,
  - "@PreAuthorize -> owasp-threat-modeling"   # one hop from the matched
  - "SecurityFilterChain -> owasp-threat-modeling"  # rule, not the full
                                     # cascade. If the evidence appears in a
                                     # file you read, load that skill and
                                     # record it in skills_loaded. The file
                                     # decides; nothing fires these. Empty or
                                     # absent means no trigger matched at
                                     # this hop, not that the task has no
                                     # further skill cascade.
acceptance: >
  A pass/fail conclusion on auth bypass. Every Known or Derived claim
  is linked to evidence. A load-bearing Estimated or Assumed claim is
  admissible if it is labeled as such and its unknown is recorded.
  An undeclared assumption behind the conclusion fails this task.
acceptance_cmd: "grep -n 'validateExpiry' src/main/java/**/AuthFilter.java"
