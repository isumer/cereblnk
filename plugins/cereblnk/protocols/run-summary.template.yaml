# (risk-model.md, fast-path abort). Trigger is one of:
# level-3-surface | scope-growth | claim-not-rederivable |
# confidence-below-floor. Populated form:
#   fast_path_abort:
#     trigger: level-3-surface
#     task_id: T-003
#     rerouted_to: 3          # verification level the run continued at
fast_path_abort: null

