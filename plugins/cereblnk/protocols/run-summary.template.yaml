# Run Summary — one per workflow run
# Location at runtime: .claude/cereblnk/telemetry/R-<date>-<seq>.yaml
# (plus one line appended to .claude/cereblnk/telemetry/runs.log)
# Written by: the orchestrator, at run end. Class: D (write rule) over
# M (real files). Analysis tooling stays F-class — this defines ONLY
# the data format and the write rule (05 the execution-mechanism map: telemetry D/F).
#
# All budget figures come from ACP budget_report fields;
# nothing is estimated at summary time.
#
# Greppability contract: the documented one-liner below must keep
# working — field names and the "over_budget:" marker are stable.
#
# Documented one-liner (total over/under-budget agents in a run —
# anchored so documentation lines never count):
#   grep -c '^    over_budget: true' R-<id>.yaml    # over-budget count
#   grep -c '^    over_budget: false' R-<id>.yaml   # within-budget count
#   grep -h '^  trigger:' R-*.yaml | sort | uniq -c # fast-path aborts by trigger
#
# The abort tally is how the fast path stays honest. A trigger that
# never fires was mis-specified; a trigger that fires on most runs
# means the pre-score is routing badly, not that the rule is working.
#
# ---- Fully worked example ----
