# ACP Response Block — Agent → Runtime
# Every agent returns exactly one Response Block. Free-form inter-agent
# text is a protocol violation — the orchestrator discards it.
#
# Field rules:
# - Every fact carries an id (F-*) and exactly one epistemic label.
# - A `known` claim MUST reference evidence (CTX-ref#lines) —.
# - A `derived` fact MUST name the known facts it follows from (`from:`).
# - A decision resting on any `assumed` fact must say so in its text.
# - `speculative` facts never drive a decision alone.
# - confidence > 0.90 requires zero assumed facts in the decision chain.
# - Budget overrun without `status: blocked` is a violation.
# (violation checker: orchestrator rejects malformed blocks; cross-block
#  contradictions: ConsistencyAgent)
#
# ---- Fully worked example (validates against) ----
acp_version: "1.0"
kind: response
task_id: T-014
role: SecurityAgent
status: completed          # completed | blocked | escalated

decision: >
  The change introduces a token-expiry bypass when clock skew exceeds 30s.

facts:
  known:
    - id: F-1
      claim: "AuthFilter no longer calls validateExpiry() on refresh path"
      evidence: [CTX-114#L42-58]
  derived:
    - id: F-2
      claim: "Expired tokens on the refresh path are accepted"
      from: [F-1]
  estimated:
    - id: F-3
      claim: "Exploit window is roughly the configured skew tolerance (~30s)"
      basis: "config value in CTX-115#L12"
  assumed:
    - id: F-4
      claim: "No upstream gateway re-validates expiry"
  speculative: []

unknowns:
  - "Whether the API gateway performs its own JWT validation"

risks:
  - severity: high
    description: "Authentication bypass on refresh endpoint"
    falsified_by: "Evidence that gateway validates expiry (resolves F-4)"

confidence: 0.78
confidence_basis: >
  High on F-1/F-2 (direct evidence). Discounted for assumption F-4.

next_action: >
  Verify gateway JWT config before finalizing severity.

skills_loaded: [java, spring-boot]   # every skill this agent loaded,
                                     # floor first, discovery additions after.
                                     # Verifier compares against the run's
                                     # skills-required.yaml.
discovery_fired:                     # a discovery_watch trigger this agent
                                     # actually saw, with what it saw it in.
                                     # Absent when nothing fired; never a
                                     # restatement of the watch list.
  - trigger: "@Entity -> hibernate-jpa"
    seen_at: src/main/java/com/example/Order.java#L14

artifacts: []

budget_report:
  tokens_received: 8000
  tokens_used: 6200

