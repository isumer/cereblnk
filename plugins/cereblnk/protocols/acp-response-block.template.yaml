# entry here and leaves the text above untouched, so the block is its
# own history and each pass reports what it cost.
#
# Appending needs no new permission: ToolFloorHook blocks in-place
# rewrites, not redirection, so `cat >> block.yaml <<'EOF'` is available
# to every role.
#
