# ACP Response Block — Agent → Runtime
# Every agent returns exactly one Response Block. Free-form inter-agent
# text is a protocol violation — the orchestrator discards it.
#
# Field rules:
# - Every fact carries an id (F-*) and exactly one epistemic label.
# - A `known` claim MUST reference evidence (CTX-ref#lines) —.
# - A `derived` fact MUST name the known facts it follows from (`from:`).
# - A decision resting on any `assumed` fact must say so in its text.
# - `speculative` facts never drive a decision alone.
# - confidence > 0.90 requires zero assumed facts in the decision chain.
# - Budget overrun without `status: blocked` is a violation.
# (violation checker: orchestrator rejects malformed blocks; cross-block
#  contradictions: ConsistencyAgent)
#
# ---- Fully worked example (validates against) ----
acp_version: "1.0"
kind: response
task_id: T-014
role: SecurityAgent
status: completed          # completed | blocked | escalated

decision: >
  The change introduces a token-expiry bypass when clock skew exceeds 30s.

facts:
  known:
    - id: F-1
      claim: "AuthFilter no longer calls validateExpiry() on refresh path"
      evidence: [CTX-114#L42-58]
  derived:
    - id: F-2
      claim: "Expired tokens on the refresh path are accepted"
      from: [F-1]
  estimated:
    - id: F-3
      claim: "Exploit window is roughly the configured skew tolerance (~30s)"
      basis: "config value in CTX-115#L12"
  assumed:
    - id: F-4
      claim: "No upstream gateway re-validates expiry"
  speculative: []

unknowns:
  - "Whether the API gateway performs its own JWT validation"

risks:
  - severity: high
    description: "Authentication bypass on refresh endpoint"
    falsified_by: "Evidence that gateway validates expiry (resolves F-4)"

confidence: 0.78
confidence_basis: >
  High on F-1/F-2 (direct evidence). Discounted for assumption F-4.

next_action: >
  Verify gateway JWT config before finalizing severity.

skills_loaded: [java, spring-boot]   # every skill this agent loaded,
                                     # floor first, discovery additions after.
                                     # Verifier compares against the run's
                                     # skills-required.yaml.

artifacts: []

budget_report:
  tokens_received: 8000
  tokens_used: 6200

# ---- revisions: APPEND, never rewrite (F-54) --------------------------
# Everything above is written once. A block that must change — a gate
# found a contradiction, a §3 re-verification is owed — APPENDS an entry
# here and leaves the text above untouched.
#
# The reason is arithmetic, and it was measured. Twelve roles deny the
# Edit tool: they decide and record, they never modify existing source.
# Their own Response Block is not source, but Edit is denied per role,
# not per path, so changing two fields meant re-emitting the whole file
# with Write. A qa-agent spent 3900 tokens against a 2500 budget to
# change two fields in a 230-line block, and reported it plainly: the
# reasoning was cheap, the re-emission was the entire overrun. A
# verifier pass ran ~9800 against 3500.
#
# Three things were wrong with that, only one of them tokens:
#   - a role that is structurally over budget declares `over_budget:
#     true` on every revision, so the flag stops carrying information;
#   - it prices self-correction above being wrong, which inverts the
#     incentive the gates exist to create;
#   - re-emission REPLACED the block, so each rewrite destroyed the
#     previous budget_report. A run summary could only report each
#     block's last pass — the cost of revising was erased by revising.
#
# Appending needs no new permission. ToolFloorHook blocks in-place
# rewrites (`sed -i`, `patch`, `ed`) and deliberately does NOT block
# redirection, so `cat >> block.yaml <<'EOF'` was always available. What
# was missing was this section telling an agent to use it.
#
# Reader rule: current state is the base block with each revision's
# `supersedes` applied in order, newest last. The base is never edited,
# so the block is its own history.
revisions: []
