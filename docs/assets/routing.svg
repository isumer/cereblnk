  <text x="0" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" fill="#E6EBEF" font-weight="400" letter-spacing="0" text-anchor="start">fix docs drift</text>
  <text x="0" y="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" fill="#E0A32E" font-weight="700" letter-spacing="0" text-anchor="start">→ /cb-docs</text>
</g>
