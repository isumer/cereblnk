<svg xmlns="http://www.w3.org/2000/svg" width="420" height="470" viewBox="0 0 420 470" role="img" aria-label="Cereblnk routing: which command a plain-language request is routed to">
<title>Cereblnk routing: which command a plain-language request is routed to</title>
<rect width="420" height="470" fill="#15181B"/>
<rect x="0" y="0" width="420" height="470" rx="3" fill="#1D2226" stroke="#E0A32E" stroke-width="1.5"/>
<text x="16" y="28" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#E6EBEF" font-weight="700" letter-spacing="2" text-anchor="start">ROUTING</text>
<text x="16" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9.5" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">11 routes · read from the dispatch skill</text>
<g id="route-0" transform="translate(16,66)">
  <text x="0" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" fill="#E6EBEF" font-weight="400" letter-spacing="0" text-anchor="start">judge a PR / diff / branch</text>
  <text x="0" y="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" fill="#E0A32E" font-weight="700" letter-spacing="0" text-anchor="start">→ /cb-pr-review</text>
</g>
<line x1="16" y1="92" x2="404" y2="92" stroke="#2F373E" stroke-width="1"/>
