  <text x="0" y="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" fill="#E0A32E" font-weight="700" letter-spacing="0" text-anchor="start">→ /cb-refactor</text>
</g>
<line x1="16" y1="308" x2="404" y2="308" stroke="#2F373E" stroke-width="1"/>
