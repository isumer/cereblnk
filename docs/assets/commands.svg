<svg xmlns="http://www.w3.org/2000/svg" width="420" height="828" viewBox="0 0 420 828" role="img" aria-label="Cereblnk entry points: the commands that start work">
<title>Cereblnk entry points: the commands that start work</title>
<rect width="420" height="828" fill="#15181B"/>
<rect x="0" y="0" width="420" height="828" rx="3" fill="#1D2226" stroke="#6B93B5" stroke-width="1.5"/>
<text x="16" y="28" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#E6EBEF" font-weight="700" letter-spacing="2" text-anchor="start">ENTRY POINTS</text>
<text x="16" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9.5" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">16 commands · type one when it matters</text>
<g id="command-column-0" transform="translate(16,62)">
  <text x="0" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" fill="#6B93B5" font-weight="700" letter-spacing="2" text-anchor="start">ROUTING</text>
  <line x1="0" y1="7" x2="370" y2="7" stroke="#2F373E" stroke-width="1"/>
  <text x="0" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#E6EBEF" font-weight="700" letter-spacing="0" text-anchor="start">/cb-dispatch</text>
  <text x="10" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">Routes plain language. Fires on description</text>
  <text x="10" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">match — a convenience, not a contract</text>
  <text x="0" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#E6EBEF" font-weight="700" letter-spacing="0" text-anchor="start">/cb-orchestrate</text>
  <text x="10" y="78" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">The routing decision, made explicitly and</text>
  <text x="10" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">shown</text>
  <text x="0" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" fill="#6B93B5" font-weight="700" letter-spacing="2" text-anchor="start">DECIDING</text>
  <line x1="0" y1="125" x2="370" y2="125" stroke="#2F373E" stroke-width="1"/>
  <text x="0" y="142" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#E6EBEF" font-weight="700" letter-spacing="0" text-anchor="start">/cb-think</text>
  <text x="10" y="154" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">Reason a problem through. No code comes out</text>
  <text x="0" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#E6EBEF" font-weight="700" letter-spacing="0" text-anchor="start">/cb-frame</text>
  <text x="10" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">Challenge the literal ask; produce a design</text>
  <text x="10" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">brief</text>
  <text x="0" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#E6EBEF" font-weight="700" letter-spacing="0" text-anchor="start">/cb-requirements</text>
  <text x="10" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">Numbered, testable requirements with</text>
  <text x="10" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">acceptance criteria</text>
  <text x="0" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#E6EBEF" font-weight="700" letter-spacing="0" text-anchor="start">/cb-design</text>
  <text x="10" y="268" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">A brief becomes an executable spec</text>
  <text x="0" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" fill="#6B93B5" font-weight="700" letter-spacing="2" text-anchor="start">BUILDING</text>
  <line x1="0" y1="303" x2="370" y2="303" stroke="#2F373E" stroke-width="1"/>
  <text x="0" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#E6EBEF" font-weight="700" letter-spacing="0" text-anchor="start">/cb-do</text>
  <text x="10" y="332" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">Build a stated, bounded change. No spec, no</text>
  <text x="10" y="344" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">plan to approve</text>
  <text x="0" y="362" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#E6EBEF" font-weight="700" letter-spacing="0" text-anchor="start">/cb-implement</text>
  <text x="10" y="374" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">Build from an approved spec, slice by verified</text>
  <text x="10" y="386" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">slice</text>
  <text x="0" y="404" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#E6EBEF" font-weight="700" letter-spacing="0" text-anchor="start">/cb-refactor</text>
  <text x="10" y="416" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">Structure changes, behaviour does not</text>
  <text x="0" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" fill="#6B93B5" font-weight="700" letter-spacing="2" text-anchor="start">CHECKING</text>
  <line x1="0" y1="451" x2="370" y2="451" stroke="#2F373E" stroke-width="1"/>
  <text x="0" y="468" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#E6EBEF" font-weight="700" letter-spacing="0" text-anchor="start">/cb-pr-review</text>
  <text x="10" y="480" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">Hunt production incidents across a diff</text>
  <text x="0" y="498" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#E6EBEF" font-weight="700" letter-spacing="0" text-anchor="start">/cb-bug</text>
  <text x="10" y="510" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">No fix without a demonstrated root cause</text>
  <text x="0" y="528" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#E6EBEF" font-weight="700" letter-spacing="0" text-anchor="start">/cb-qa</text>
  <text x="10" y="540" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">Test the surfaces the branch actually touched</text>
  <text x="0" y="558" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#E6EBEF" font-weight="700" letter-spacing="0" text-anchor="start">/cb-security-audit</text>
  <text x="10" y="570" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">Trust boundaries and secrets, always at gate</text>
  <text x="10" y="582" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">level 3</text>
  <text x="0" y="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#E6EBEF" font-weight="700" letter-spacing="0" text-anchor="start">/cb-docs</text>
  <text x="10" y="612" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">Find every statement the diff made stale</text>
  <text x="0" y="640" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" fill="#6B93B5" font-weight="700" letter-spacing="2" text-anchor="start">SESSION GUARDS</text>
  <line x1="0" y1="647" x2="370" y2="647" stroke="#2F373E" stroke-width="1"/>
  <text x="0" y="664" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#E6EBEF" font-weight="700" letter-spacing="0" text-anchor="start">/cb-careful</text>
  <text x="10" y="676" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">Block irreversible shell operations until</text>
  <text x="10" y="688" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">turned off</text>
  <text x="0" y="706" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#E6EBEF" font-weight="700" letter-spacing="0" text-anchor="start">/cb-boundary</text>
  <text x="10" y="718" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">Confine writes to one directory</text>
</g>
</svg>
