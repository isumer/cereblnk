<g id="event-SessionEnd" transform="translate(16,994)">
  <text x="0" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#8C99A2" font-weight="700" letter-spacing="0.5" text-anchor="start">SessionEnd</text>
  <text x="0" y="15" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9.5" fill="#66727A" font-weight="400" letter-spacing="0" text-anchor="start">when the session ends</text>
  <line x1="0" y1="24" x2="370" y2="24" stroke="#8C99A2" stroke-width="1"/>
  <text x="0" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#8C99A2" font-weight="400" letter-spacing="0" text-anchor="start">□ env-teardown</text>
  <text x="13" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="9" fill="#66727A" font-weight="400" letter-spacing="0" text-anchor="start">Reclaims an environment a run left up</text>
