<text x="30" y="1458" class="small">• Context is expensive.   • Evidence is valuable.</text>
<text x="30" y="1471" class="small">• Verification is mandatory.   • Specialists implement; conductor coordinates.</text>
<text x="30" y="1484" class="small">• Specialists stay in boundaries.   • Floors self-enforce.</text>
<text x="30" y="1497" class="small">• Human stays in the outcome.</text>
