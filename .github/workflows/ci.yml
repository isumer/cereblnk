# Cereblnk CI — the deterministic acceptance layer, on every push and PR.
#
# This runs exactly `scripts/verify`: the same single entry a contributor
# runs locally (CONTRIBUTING.md), no more and no less. It does NOT verify
# workflow behavior — that is prompt-driven and can only be established by
# running the workflows.
# A green check here means the scripted guards, parsers, linters, and skill
# graph hold; it is not a claim that the agents reason correctly.
name: verify

# Release branches are gated like main: a task branch merges into
# feature/**, and that merge has to be checked where it lands, not only
# when the release finally reaches main. Task branches (cb/**) are
# covered by their pull request rather than by a second push run.
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'

# Least-privilege: this job only reads the checked-out tree.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the tree
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # scripts/verify and every suite it calls are standard-library only
      # and offline by design (Reality Map: no F-class network deps). No
      # pip install step exists because there is nothing to install — if
      # that ever changes, it is a deliberate dependency decision, not a
      # silent one.
      - name: Confirm bash and python are present
        run: |
          bash --version | head -1
          python3 --version

      - name: Run the deterministic acceptance suite
        run: python3 scripts/verify

  # The release gate. Runs only where the decision is made — a pull
  # request into main — because open items are the normal state on a
  # release branch and on every task branch feeding it. That is also why
  # it is not part of scripts/verify.
  release-ready:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the tree
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refuse a release that still has open backlog items
        run: python3 scripts/check-release-ready
