# Cereblnk runtime smoke — host integration, measured rather than declared.
#
# One workflow, not four. The stages are the same questions on every host
# and only the commands differ, so four near-identical files would drift
# apart in the way this repository spends most of its checkers preventing.
# Host-specific logic lives in tests/runtime/<host>/stages.sh; this file
# orchestrates and uploads.
#
# It is deliberately separate from `verify`, which stays offline and
# deterministic. Host runtime certification is an online integration
# layer that runs beside the core gate, never inside it — a contributor
# without network access must still be able to run the whole acceptance
# suite.
#
# Tiers, and why the expensive one is not mandatory:
#
#   Tier 1  packaging and generation, no host binary   every relevant PR
#   Tier 2  host CLI install, version, discovery       every relevant PR
#   Tier 3  authenticated session, skill/hook/veto     where secrets exist
#
# Mandatory CI that depends on a vendor session is flaky CI, and flaky
# mandatory CI teaches people to ignore red. Tier 3 stages report BLOCKED
# with a reason when credentials are absent, which is valid evidence and
# not a failure — so this workflow costs nothing extra until somebody
# configures a secret, and needs no change when they do.
#
# It also runs on a push to a release branch, which is how a merge
# reaches it. Dispatch requires an actions:write token, and requiring a
# token scope to take a measurement puts the measurement behind a
# permission rather than behind a decision. A merge is a thing that
# happens anyway.
name: runtime-smoke

on:
  workflow_dispatch:
    inputs:
      host:
        description: Host to probe
        required: true
        default: codex
        type: choice
        options: [codex, claude, cursor, gemini]
  push:
    branches:
      - main
      - 'feature/**'
    paths: &runtime_paths
      - '.agents/plugins/**'
      - '.cursor-plugin/**'
      - 'plugins/cereblnk/.codex-plugin/**'
      - 'plugins/cereblnk/.cursor-plugin/**'
      - 'plugins/cereblnk/gemini-extension.json'
      - 'plugins/cereblnk/policies/capabilities.yaml'
      - 'plugins/cereblnk/policies/hosts/**'
      - 'plugins/cereblnk/hooks/**'
      - 'plugins/cereblnk/scripts/lib/**'
      - 'scripts/host-probe'
      - 'scripts/gen-bindings'
      - 'scripts/check-generated'
      - 'scripts/check-runtime-evidence'
      - 'tests/runtime/**'
      - '.github/workflows/runtime-smoke.yml'
  pull_request:
    paths:
      - '.agents/plugins/**'
      - '.cursor-plugin/**'
      - 'plugins/cereblnk/.codex-plugin/**'
      - 'plugins/cereblnk/.cursor-plugin/**'
      - 'plugins/cereblnk/gemini-extension.json'
      - 'plugins/cereblnk/policies/capabilities.yaml'
      - 'plugins/cereblnk/policies/hosts/**'
      - 'plugins/cereblnk/hooks/**'
      - 'plugins/cereblnk/scripts/lib/**'
      - 'scripts/host-probe'
      - 'scripts/gen-bindings'
      - 'scripts/check-generated'
      - 'scripts/check-runtime-evidence'
      - 'tests/runtime/**'
      - '.github/workflows/runtime-smoke.yml'

permissions:
  contents: read
  # The evidence is rendered into the run summary and, on a pull request,
  # into a comment. Correct evidence that needs a zip download to read is
  # evidence nobody reads — which is what happened for the first several
  # runs, to reviewer and author alike.
  pull-requests: write

concurrency:
  group: runtime-smoke-${{ github.ref }}-${{ inputs.host || 'all' }}
  cancel-in-progress: true

jobs:
  # Tier 1, once. A runtime result measured against a tree nobody vouched
  # for is worth nothing, so this gates the probes — and it runs once
  # rather than inside each of them, because four identical verifications
  # of the same commit is three wasted runners.
  gate:
    name: deterministic layer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: ./scripts/verify

  probe:
    needs: gate
    name: ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Dispatch probes the host you named. A pull request probes all
      # four, because a change to the shared runner or to capabilities.yaml
      # reaches every host — and a matrix that quietly ran one would let
      # three drivers rot untested, which is exactly what happened between
      # CB-156 landing them and this change.
      #
      # fail-fast off: a failing host must not cancel the other three.
      # Their evidence is the reason the run exists.
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.host && format('["{0}"]', inputs.host) || '["claude","codex","cursor","gemini"]') }}
    steps:
      - name: Check out the tree
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        if: ${{ matrix.host != 'cursor' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Tier 2. Best effort by design: a vendor package that will not
      # install is a fact about today, and the install stage records it as
      # BLOCKED rather than failing the job.
      #
      # Cursor has no entry here, and that absence is deliberate rather
      # than an oversight. Its install stage says so, because a blank line
      # in a workflow and a host with no published CLI install look the
      # same from the outside.
      - name: Install the host CLI
        if: ${{ matrix.host != 'cursor' }}
        continue-on-error: true
        run: |
          case "${{ matrix.host }}" in
            codex)  npm install -g @openai/codex ;;
            claude) npm install -g @anthropic-ai/claude-code ;;
            gemini) npm install -g @google/gemini-cli ;;
          esac

      # The validator imports PyYAML, and a runner without it crashes
      # before reading a single manifest field. The first Codex run
      # recorded plugin FAIL for that reason, which read as a rejected
      # manifest and was not one. The stage now tells the two apart, and
      # this step removes the cause rather than relying only on the
      # distinction.
      #
      # Here rather than in scripts/verify: this file is the online
      # integration layer, and the core gate stays offline.
      - name: Install the validator's dependencies
        if: ${{ matrix.host == 'codex' }}
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Fetch the vendor plugin validator
        if: ${{ matrix.host == 'codex' }}
        continue-on-error: true
        run: |
          set -u
          url=https://raw.githubusercontent.com/openai/codex/main/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py
          if curl -sfL --max-time 30 "$url" -o "$RUNNER_TEMP/validate_plugin.py"; then
            echo "CODEX_VALIDATOR=$RUNNER_TEMP/validate_plugin.py" >> "$GITHUB_ENV"
          else
            echo "validator not reachable; the plugin stage will report UNMEASURED"
          fi

      # Each host receives its own credential and no other. The earlier
      # version handed all three to every job, so the Cursor probe — which
      # needs none — ran with three providers' keys in its environment,
      # and a Gemini stage script could have read the Codex key. Neither
      # was going to happen on purpose; a credential reachable by code
      # that has no use for it is a credential one edit away from leaving.
      #
      # A host with no secret configured gets an empty string, its stage
      # script reports BLOCKED, and no session opens.
      - name: Walk the stages
        env:
          CB_RUNTIME_WORKDIR: ${{ runner.temp }}/cb-runtime
          CODEX_API_KEY: ${{ matrix.host == 'codex' && secrets.CODEX_API_KEY || '' }}
          # The CLI may read either name; which one is unmeasured, and
          # setting both from one secret costs nothing while guessing
          # wrong costs a run.
          OPENAI_API_KEY: ${{ matrix.host == 'codex' && secrets.CODEX_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.host == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          GEMINI_API_KEY: ${{ matrix.host == 'gemini' && secrets.GEMINI_API_KEY || '' }}
        run: |
          mkdir -p "$CB_RUNTIME_WORKDIR"
          python3 tests/runtime/run-host "${{ matrix.host }}" \
            --out "$CB_RUNTIME_WORKDIR/summary.json"

      # Before the guard, because a rendered table of a failed run is the
      # thing somebody needs; and after the stages, because that is when
      # there is something to render. It reads only fields the schema
      # defines and never touches the raw logs.
      - name: Say the result out loud
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/cb-runtime/summary.json" ]; then
            python3 scripts/render-evidence \
              "${{ runner.temp }}/cb-runtime/summary.json" \
              --title "Runtime evidence — ${{ matrix.host }}" \
              | tee -a "$GITHUB_STEP_SUMMARY" \
              > "${{ runner.temp }}/evidence.md"
          else
            echo "No summary.json — the stages did not run." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment the result on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "${{ runner.temp }}/evidence.md" ] || exit 0
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file "${{ runner.temp }}/evidence.md"

      # Last look before anything leaves. Everything upstream is careful;
      # this assumes something upstream was not. It fails the job rather
      # than the upload, because an artifact that had to be caught here is
      # a defect somewhere else that nobody would otherwise see.
      - name: Refuse to publish a leaked credential
        if: always()
        env:
          CODEX_API_KEY: ${{ matrix.host == 'codex' && secrets.CODEX_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.host == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          GEMINI_API_KEY: ${{ matrix.host == 'gemini' && secrets.GEMINI_API_KEY || '' }}
        run: |
          python3 scripts/check-artifact-safe "${{ runner.temp }}/cb-runtime" \
            --secrets CODEX_API_KEY,OPENAI_API_KEY,ANTHROPIC_API_KEY,GEMINI_API_KEY

      # The artifact is the point of the run. It is uploaded even when the
      # stages failed, because a failed run is the evidence somebody needs
      # most and discarding it would leave only a red tick.
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence-${{ matrix.host }}
          path: ${{ runner.temp }}/cb-runtime/
          retention-days: 30
          if-no-files-found: warn
